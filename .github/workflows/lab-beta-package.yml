name: LAB beta3 reproducible ZIP

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-beta-package:
    name: Build and verify LAB-only package
    # Build for the one consolidated integration review, not every stacked draft.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'integration/') || github.event.pull_request.base.ref == 'develop/import-lab-beta1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check development metadata
        run: python3 scripts/check-release-metadata.py
      - name: Build two identical LAB archives
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-lab-zip.py \
            --output dist/chronoarchive-2.1.0-beta3-LAB.zip
          python3 scripts/build-lab-zip.py \
            --output dist/repeat/chronoarchive-2.1.0-beta3-LAB.zip
          cmp dist/chronoarchive-2.1.0-beta3-LAB.zip \
            dist/repeat/chronoarchive-2.1.0-beta3-LAB.zip
          unzip -t dist/chronoarchive-2.1.0-beta3-LAB.zip
          sha256sum dist/chronoarchive-2.1.0-beta3-LAB.zip
          php -l chronoarchive.php
      - name: Verify future WordPress.org lowercase package (QA candidate)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-wporg-zip.py --output dist/chronoarchive-2.1.0-beta3-WPORG-QA.zip
          python3 scripts/build-wporg-zip.py --output dist/repeat/chronoarchive-2.1.0-beta3-WPORG-QA.zip
          cmp dist/chronoarchive-2.1.0-beta3-WPORG-QA.zip dist/repeat/chronoarchive-2.1.0-beta3-WPORG-QA.zip
          unzip -t dist/chronoarchive-2.1.0-beta3-WPORG-QA.zip
          # A prerelease MUST fail the real publish gate.
          if python3 scripts/build-wporg-zip.py --release --output dist/forbidden-stable.zip; then
            echo 'FAIL: a beta incorrectly passed the stable package gate'
            exit 1
          fi
          test ! -e dist/forbidden-stable.zip
          echo 'PASS: lowercase slug QA package deterministic, stable gate blocks beta'
      - name: Upload private QA workflow artifact (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: chronoarchive-2.1.0-beta3-QA-NOT-PRODUCTION
          path: |
            dist/chronoarchive-2.1.0-beta3-LAB.zip
            dist/chronoarchive-2.1.0-beta3-WPORG-QA.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
