name: WordPress Plugin Check

# Full official review remains strictly blocking when a PR is ready
# for review or on the release path. Draft iteration stays readable.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: chrono-plugin-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: Official Plugin Check
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Plugin Check runs its own isolated WordPress wp-env installation.
      # Findings remain blocking until triaged, without suppressing errors.
      - name: Run official WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './'
          slug: chronoarchive
          exclude-directories: 'tests,docs,scripts,.github'
          exclude-files: '.gitignore,.gitattributes,.github/workflows/wordpress-integration.yml,.github/workflows/static-checks.yml'
